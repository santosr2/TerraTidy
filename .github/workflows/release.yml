name: Release

on:
  push:
    tags:
      # Full X.Y.Z (and X.Y.Z-prerelease) tags only. The floating aliases v0 / v0.2
      # pushed by update-version-tags have fewer than two dots, so they do NOT match
      # here. Without this, every alias push would re-trigger Release and loop.
      - 'v*.*.*'
  # Re-release an existing tag from its own commit without moving the tag
  # (e.g. after a transient CI failure). The tag is never re-pointed, so the
  # Go module proxy / sum.golang.org entry for that version stays consistent.
  #
  # Dispatch this with the tag itself as the ref, not from a branch:
  #
  #     gh workflow run release.yml --ref v0.2.0
  #
  # cosign's keyless signing and actions/attest-build-provenance both take the
  # certificate identity from the ref the run is on, which actions/checkout
  # cannot change. Dispatching from a branch therefore builds the right commit
  # but signs it as refs/heads/<branch>, and verification pinned to
  # refs/tags/<version> fails.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    steps:
      - name: Verify the run is on a releasable tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release must run on a tag, but this run is on refs/heads/$REF_NAME." >&2
            echo "::error::Dispatch it with the tag as the ref: gh workflow run release.yml --ref vX.Y.Z" >&2
            echo "::error::cosign and the provenance attestation take the certificate identity from the ref" >&2
            echo "::error::of the run, so a branch run publishes artifacts that only verify as a branch." >&2
            exit 1
          fi
          # update-version-tags force-pushes floating aliases (v0, v0.2, v0-alpha,
          # v0.2-alpha) onto whatever the newest release is. Those are tags too, so
          # only a full vX.Y.Z tag is releasable -- the same two-dot rule the push
          # trigger applies with 'v*.*.*'.
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$REF_NAME is not a full release tag. Expected vX.Y.Z or vX.Y.Z-prerelease." >&2
            echo "::error::The floating aliases pushed by update-version-tags must not be released from," >&2
            echo "::error::because they move, and releasing from one would republish an existing version." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The run is always on the tag, so this is the tag's own commit for
          # both a tag push and a manual dispatch.
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false  # Disable cache to prevent cache poisoning on tag-triggered releases

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      # --strip all, not just the header: the footer emits Keep a Changelog link
      # reference definitions, which exist so the many version headings in
      # CHANGELOG.md resolve to their compare views. A single release's notes carry
      # exactly one, and the page already ends with a Full Changelog link, so keeping
      # it would only turn the "## [x.y.z]" heading into a stray link. The two
      # CHANGELOG.md invocations below keep the footer, where it belongs.
      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for the multi-arch (linux/amd64 + linux/arm64) Docker builds in
      # .goreleaser.yml: QEMU emulates arm64 on the amd64 runner, buildx drives it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # cosign v3.x (installed by cosign-installer) cannot verify goreleaser
          # v2.15.0's sigstore bundle; v2.16.0's bundle verifies under cosign v3.
          version: v2.16.0
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign checksums with cosign
        run: cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.bundle

      - name: Upload cosign artifacts
        run: |
          gh release upload "$TAG_NAME" dist/checksums.txt.bundle --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/checksums.txt'

  trivy-scan:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/santosr2/terratidy:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: 'trivy-results.sarif'

  parse-version:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse version from tag
        id: parse
        run: |
          FULL_VERSION="${TAG_NAME#v}"
          BASE_VERSION="${FULL_VERSION%%-*}"
          if [ "$BASE_VERSION" = "$FULL_VERSION" ]; then
            PRERELEASE=""
          else
            PRERELEASE="${FULL_VERSION#*-}"
            PRERELEASE="${PRERELEASE%%.*}"
          fi
          MAJOR="${BASE_VERSION%%.*}"
          MINOR="${BASE_VERSION#*.}"
          MINOR="${MINOR%%.*}"

          {
            echo "tag=$TAG_NAME"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Parsed: tag=$TAG_NAME major=$MAJOR minor=$MINOR prerelease=$PRERELEASE"
        env:
          TAG_NAME: ${{ github.ref_name }}

  update-changelog:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Generate full changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${TAG_NAME}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  update-version-tags:
    needs: [parse-version, goreleaser]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: version-tags-v${{ needs.parse-version.outputs.major }}.${{ needs.parse-version.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version alias tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          if [[ -n "$PRERELEASE" ]]; then
            echo "Pre-release detected: $PRERELEASE"

            git tag -f "v${MAJOR}-${PRERELEASE}" "$TAG"
            git push -f origin "v${MAJOR}-${PRERELEASE}"

            git tag -f "v${MAJOR}.${MINOR}-${PRERELEASE}" "$TAG"
            git push -f origin "v${MAJOR}.${MINOR}-${PRERELEASE}"
          else
            echo "Stable release detected"

            git tag -f "v${MAJOR}" "$TAG"
            git push -f origin "v${MAJOR}"

            git tag -f "v${MAJOR}.${MINOR}" "$TAG"
            git push -f origin "v${MAJOR}.${MINOR}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.parse-version.outputs.tag }}
          MAJOR: ${{ needs.parse-version.outputs.major }}
          MINOR: ${{ needs.parse-version.outputs.minor }}
          PRERELEASE: ${{ needs.parse-version.outputs.prerelease }}

  update-docker-tags:
    needs: [parse-version, goreleaser]
    if: needs.parse-version.outputs.prerelease != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Update Docker alias tags
        run: |
          crane auth login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"

          crane tag "${IMAGE}:${TAG}" "v${MAJOR}-${PRERELEASE}"
          echo "Updated Docker tag: v${MAJOR}-${PRERELEASE}"

          crane tag "${IMAGE}:${TAG}" "v${MAJOR}.${MINOR}-${PRERELEASE}"
          echo "Updated Docker tag: v${MAJOR}.${MINOR}-${PRERELEASE}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/santosr2/terratidy
          TAG: ${{ needs.parse-version.outputs.tag }}
          MAJOR: ${{ needs.parse-version.outputs.major }}
          MINOR: ${{ needs.parse-version.outputs.minor }}
          PRERELEASE: ${{ needs.parse-version.outputs.prerelease }}

  smoke-test:
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: testdata
          persist-credentials: false

      - name: Download released binary
        run: |
          gh release download "$TAG_NAME" --repo santosr2/terratidy \
            -p "terratidy-*-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            -D /tmp/terratidy-release
          tar -xzf /tmp/terratidy-release/terratidy-*.tar.gz -C /tmp/terratidy-release
          chmod +x /tmp/terratidy-release/terratidy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Verify version
        run: /tmp/terratidy-release/terratidy version

      - name: Run check on test fixtures
        run: /tmp/terratidy-release/terratidy check --format text testdata/ || true

  test-homebrew:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser pushes the freshly generated formula to main after the tag
          # was cut, so check out main (not the tag) to smoke-test the real formula.
          ref: main
          persist-credentials: false

      - name: Test Homebrew formula
        run: |
          # Modern Homebrew refuses `brew install <path/to/formula.rb>`; a formula
          # must live in a tap. Stage the freshly generated formula in a throwaway
          # local tap and build-install it from there.
          TAP_DIR="$(brew --repository)/Library/Taps/terratidy/homebrew-localtest"
          mkdir -p "$TAP_DIR/Formula"
          cp Formula/terratidy.rb "$TAP_DIR/Formula/terratidy.rb"
          brew install --build-from-source terratidy/localtest/terratidy
          terratidy version

  # Every tag attaches the .vsix to the GitHub release. Only stable tags publish to
  # the VS Code Marketplace; pre-release testers install the .vsix manually.
  # Depends on goreleaser so the GitHub release is guaranteed to exist before upload.
  vscode-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write  # Required to upload the .vsix to the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          # Full history + tags so git-cliff can render the finalized changelog below.
          fetch-depth: 0
          persist-credentials: false

      # The tag's tree freezes CHANGELOG.md at its pre-release state: the finalized
      # entry for this version is only git-cliff'd onto main *after* the tag is cut,
      # so a tag checkout would bundle a stale changelog (e.g. topping out at an
      # -alpha entry). Regenerate it here so the packaged .vsix embeds the real
      # released section. vscode/CHANGELOG.md is a symlink to this root file, so vsce
      # bundles whatever we write here.
      - name: Finalize changelog for this tag
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.x"
          no-cache: true  # Disable cache for security-sensitive publish job

      - name: Install dependencies
        working-directory: vscode
        run: bun install --frozen-lockfile

      # vsce package bundles via esbuild, which strips types without checking them.
      # Type-check explicitly: a Marketplace version cannot be unpublished.
      - name: Type check
        working-directory: vscode
        run: bun run compile

      - name: Package extension
        working-directory: vscode
        run: bunx @vscode/vsce package --out terratidy.vsix

      - name: Attach VSIX to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" vscode/terratidy.vsix --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to VS Code Marketplace
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --packagePath ./terratidy.vsix

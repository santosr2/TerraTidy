name: Container Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-container-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: terratidy-test

jobs:
  # Decides whether this change touches anything the jobs below test. The path
  # filter lives here rather than on the triggers so that the workflow always
  # starts: a workflow skipped by a trigger filter reports nothing, and a
  # required check that never reports blocks the pull request indefinitely.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # List the files a pull request changes
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Pull requests are compared through the API. Pushes are compared with git,
      # which needs the repository.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the true/false output below is used. The action's list of changed
      # file names is never read.
      - name: Match changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'Dockerfile'
              - '.dockerignore'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.go-version'
              - '.github/workflows/container-test.yml'

  build-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately not go-version-file: go.mod. That directive is the minimum
      # supported Go, and setup-go installs it exactly. The Trivy step below reads
      # the stdlib version stamped into the compiled binary, so building on the
      # floor makes the scan report stdlib CVEs against a Go patch release that
      # never ships. .go-version is the toolchain release.yml builds with, so the
      # scan stays a truthful proxy for the published image. It is pinned rather
      # than floating: a new stdlib patch now surfaces as a scan finding against
      # the Go version actually shipping, which is the signal to bump .go-version.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Build Go binary
        run: |
          # The Dockerfile reads the binary from $TARGETPLATFORM/ so that the
          # release build can assemble a multi-platform context; BuildKit sets
          # that to linux/amd64 here.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o linux/amd64/terratidy ./cmd/terratidy

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_NAME:latest" .

      - name: Verify image exists
        run: |
          docker images "$IMAGE_NAME:latest" --format "{{.Repository}}:{{.Tag}}"
          if ! docker images -q "$IMAGE_NAME:latest" | grep -q .; then
            echo "::error::Docker image was not built"
            exit 1
          fi
          echo "Docker build succeeded"

      - name: Save Docker image
        run: |
          docker save "$IMAGE_NAME:latest" | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  run-test:
    name: Container Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Run terratidy version
        run: |
          OUTPUT=$(docker run --rm "$IMAGE_NAME:latest" version)
          echo "Version output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -qi "terratidy"; then
            echo "::error::Expected 'terratidy' in version output"
            exit 1
          fi
          echo "Container version command succeeded"

  check-test:
    name: Container Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Create test Terraform files
        run: |
          mkdir -p test-terraform
          printf '%s\n' \
            'terraform {' \
            '  required_version = ">= 1.0"' \
            '}' \
            '' \
            'resource "aws_instance" "example" {' \
            '  ami           = "ami-12345678"' \
            '  instance_type = "t2.micro"' \
            '}' > test-terraform/main.tf

      - name: Run terratidy check in container
        run: |
          docker run --rm -v "$PWD/test-terraform:/app/terraform:ro" "$IMAGE_NAME:latest" check /app/terraform --format=json || true
          echo "Container check command executed"

      - name: Verify container can process files
        run: |
          # Run check and capture output (exit code may be non-zero due to findings)
          OUTPUT=$(docker run --rm -v "$PWD/test-terraform:/app/terraform:ro" "$IMAGE_NAME:latest" check /app/terraform --format=json 2>&1) || true
          echo "Check output: $OUTPUT"
          # Verify we got valid JSON output (not an error message)
          if echo "$OUTPUT" | grep -q '"findings"'; then
            echo "Container successfully processed Terraform files"
          elif echo "$OUTPUT" | grep -q "no HCL files found"; then
            echo "::error::Container could not find mounted files"
            exit 1
          else
            echo "Container executed (output may vary based on file content)"
          fi

  healthcheck-test:
    name: Container Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Verify healthcheck is defined
        run: |
          HEALTHCHECK=$(docker inspect "$IMAGE_NAME:latest" --format='{{json .Config.Healthcheck}}')
          echo "Healthcheck config: $HEALTHCHECK"
          if [ "$HEALTHCHECK" = "null" ]; then
            echo "::error::No healthcheck defined in Dockerfile"
            exit 1
          fi
          echo "Healthcheck is defined"

      - name: Run container and verify healthcheck
        run: |
          # Start container in background with a long-running command
          # Override entrypoint since default is terratidy
          CONTAINER_ID=$(docker run -d --entrypoint sh "$IMAGE_NAME:latest" -c "sleep 120")
          echo "Started container: $CONTAINER_ID"

          # Poll for healthcheck to complete (timeout after 60s)
          # Dockerfile: start-period=5s, interval=30s, timeout=3s
          MAX_ATTEMPTS=20
          ATTEMPT=0
          HEALTH=""

          echo "Waiting for healthcheck..."
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HEALTH=$(docker inspect "$CONTAINER_ID" --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
            echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS: Health status = $HEALTH"

            if [ "$HEALTH" = "healthy" ]; then
              break
            elif [ "$HEALTH" = "unhealthy" ]; then
              echo "::error::Container healthcheck failed"
              docker logs "$CONTAINER_ID" 2>&1 || true
              docker stop "$CONTAINER_ID" > /dev/null 2>&1 || true
              docker rm "$CONTAINER_ID" > /dev/null 2>&1 || true
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done

          # Clean up
          docker stop "$CONTAINER_ID" > /dev/null 2>&1 || true
          docker rm "$CONTAINER_ID" > /dev/null 2>&1 || true

          if [ "$HEALTH" = "healthy" ]; then
            echo "Container healthcheck passed"
          else
            echo "::error::Container healthcheck did not reach healthy status within timeout (final status: $HEALTH)"
            exit 1
          fi

  # The release workflow also scans the image, but it runs on tags, so its results
  # upload under refs/tags/* where the default-branch Security view never shows them.
  # Scanning here puts Trivy on refs/heads/main alongside the other scanners and
  # refreshes it per push, so a CVE published between releases surfaces immediately.
  #
  # Findings do not fail the build, matching the release workflow: most come from the
  # Alpine base layer and are not actionable in the moment. The SARIF upload is the
  # signal.
  trivy-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]
    permissions:
      contents: read
      security-events: write

    steps:
      # Checked out only so Trivy can read .trivyignore; the scanned image
      # itself comes from the build-test artifact, not from this working tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      # No severity filter: trivy-action's `severity` input does not apply to SARIF
      # output unless `limit-severities-for-sarif` is also set, so a filter here
      # would read as if it were narrowing the upload while doing nothing. Since
      # the upload is the signal, reporting every severity is the intent anyway.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: container-test-trivy

  non-root-test:
    name: Container Non-Root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Verify container runs as non-root
        run: |
          # Check the configured user
          USER=$(docker inspect "$IMAGE_NAME:latest" --format='{{.Config.User}}')
          echo "Configured user: $USER"

          if [ -z "$USER" ] || [ "$USER" = "root" ] || [ "$USER" = "0" ]; then
            echo "::error::Container should not run as root"
            exit 1
          fi

          # Verify at runtime
          RUNTIME_USER=$(docker run --rm --entrypoint sh "$IMAGE_NAME:latest" -c "whoami")
          echo "Runtime user: $RUNTIME_USER"

          if [ "$RUNTIME_USER" = "root" ]; then
            echo "::error::Container is running as root at runtime"
            exit 1
          fi

          # Verify UID is not 0
          RUNTIME_UID=$(docker run --rm --entrypoint sh "$IMAGE_NAME:latest" -c "id -u")
          echo "Runtime UID: $RUNTIME_UID"

          if [ "$RUNTIME_UID" = "0" ]; then
            echo "::error::Container is running with UID 0"
            exit 1
          fi

          echo "Container runs as non-root user: $RUNTIME_USER (UID: $RUNTIME_UID)"

  # The one check to require for this workflow. It waits on every other job and
  # passes only if each one succeeded or was skipped because the change did not
  # touch what it tests. It uses always() rather than !cancelled() on purpose: a
  # cancelled run has to fail this check, whereas a skipped required check would
  # count as passing.
  result:
    name: Container result
    if: always()
    needs: [changes, build-test, run-test, check-test, healthcheck-test, trivy-scan, non-root-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r 'to_entries[]
            | select((.key == "changes" and .value.result != "success")
                     or (.value.result != "success" and .value.result != "skipped"))
            | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi

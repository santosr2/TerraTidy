# TerraTidy Lint Configuration Example
#
# The lint engine provides 11 built-in AST rules that work without external dependencies.
# TFLint integration is optional and invoked as a subprocess (not embedded) for
# provider-specific checks (AWS, Google, Azure).

version: 1

# Lint engine configuration
engines:
  fmt:
    enabled: true

  style:
    enabled: true

  lint:
    enabled: true
    config_file: .tflint.hcl    # Path to TFLint config file
    # Enable specific plugins (optional)
    plugins:
      - aws
      # - google
      # - azurerm
    # Extra arguments to pass to TFLint
    # args:
    #   - --minimum-tf-version=1.0.0
    #   - --force
    # TFLint integration options
    # use_tflint: true          # Enable TFLint subprocess integration
    # tflint_path: tflint       # Custom TFLint binary path
    # fallback_builtin: true    # Use built-in rules if TFLint unavailable
    # Engine-level rule configuration
    # rules:
    #   terraform_deprecated_interpolation:
    #     enabled: true
    #     severity: error

  policy:
    enabled: false

# Rule overrides (applies to style and lint engines)
overrides:
  rules:
    # Terraform core rules
    terraform-required-version:
      enabled: true
      severity: error

    terraform-deprecated-syntax:
      enabled: true
      severity: warning

    terraform-unused-declarations:
      enabled: true
      severity: warning

    terraform-documented-variables:
      enabled: true
      severity: warning

    # AWS-specific rules (requires aws plugin)
    # aws_instance_invalid_type:
    #   enabled: true
    #   severity: error

# Global settings
severity_threshold: warning
fail_fast: false

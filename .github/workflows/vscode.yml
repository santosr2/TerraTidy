name: VSCode Extension

# CI only. Marketplace publishing and .vsix release uploads live in release.yml,
# which already runs on v* tags and can order itself after the GitHub release exists.
on:
  push:
    branches: [main]
    paths:
      - "vscode/**"
      - "internal/lsp/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    branches: [main]
    paths:
      - "vscode/**"
      - "internal/lsp/**"
      - ".github/workflows/vscode.yml"

permissions:
  contents: read

concurrency:
  group: ci-vscode-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Dependabot PRs need write access to push lockfile updates
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For Dependabot PRs, check out the branch head instead of the PR merge ref
          # so the regenerated bun.lock commits onto the branch tip and pushes back as a
          # fast-forward. Empty string falls back to the default (merge ref) for everyone else.
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}
          # Persist credentials for Dependabot lockfile commits
          persist-credentials: ${{ github.actor == 'dependabot[bot]' }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false  # Disable cache to prevent cache poisoning on PRs

      - name: Build TerraTidy binary
        run: |
          go build -o bin/terratidy ./cmd/terratidy
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.x"
          no-cache: true  # Disable cache to prevent cache poisoning on PRs

      - name: Install dependencies
        working-directory: vscode
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
            # Dependabot can't update bun.lock (binary), so regenerate it
            bun install
          else
            bun install --frozen-lockfile
          fi

      # zizmor: ignore[bot-conditions] - Dependabot PRs are trusted, actor check is intentional
      - name: Commit updated lockfile (Dependabot only)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && matrix.os == 'ubuntu-latest'
        working-directory: vscode
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet bun.lock; then
            echo "No lockfile changes to commit"
          else
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(vscode): update bun.lock for Dependabot PR"
            # Push explicitly to the PR head ref (checkout above put us on the branch tip)
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Lint
        working-directory: vscode
        run: bun run lint

      - name: Compile
        working-directory: vscode
        run: bun run compile

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: vscode
        run: xvfb-run -a bun run test

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: vscode
        run: bun run test

      - name: Package extension
        working-directory: vscode
        run: bun run package

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terratidy-vsix-${{ matrix.os }}
          path: vscode/*.vsix
          retention-days: 7

# Configuration for GitHub Discussions
# https://docs.github.com/en/discussions/managing-discussions-for-your-community/creating-discussion-category-forms

# Note: Discussion categories must be created in the repository settings first.
# The template filenames (announcements.yml, q-a.yml, etc.) must match the category slugs.
#
# To enable these templates:
# 1. Go to Repository Settings > General > Features > Discussions
# 2. Enable Discussions
# 3. Create categories with these slugs: announcements, q-a, ideas, show-and-tell

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-changelog:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${GITHUB_REF#refs/tags/}"
          git push origin main

  update-version-tags:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version alias tags
        run: |
          # Extract version from tag (e.g., v0.1.0 or v0.1.0-alpha.1)
          FULL_VERSION=${GITHUB_REF#refs/tags/v}

          # Split version and pre-release identifier
          BASE_VERSION=$(echo "$FULL_VERSION" | cut -d- -f1)
          PRERELEASE=$(echo "$FULL_VERSION" | grep -oP '(?<=-)[a-z]+' || echo "")

          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$PRERELEASE" ]]; then
            # Pre-release version (e.g., v0.1.0-alpha.1)
            # Create pre-release alias tags: v0-alpha, v0.1-alpha
            echo "Pre-release detected: $PRERELEASE"

            git tag -f "v${MAJOR}-${PRERELEASE}" "${GITHUB_REF#refs/tags/}"
            git push -f origin "v${MAJOR}-${PRERELEASE}"
            echo "Updated tag: v${MAJOR}-${PRERELEASE}"

            git tag -f "v${MAJOR}.${MINOR}-${PRERELEASE}" "${GITHUB_REF#refs/tags/}"
            git push -f origin "v${MAJOR}.${MINOR}-${PRERELEASE}"
            echo "Updated tag: v${MAJOR}.${MINOR}-${PRERELEASE}"
          else
            # Stable release (e.g., v0.1.0)
            # Create stable alias tags: v0, v0.1
            echo "Stable release detected"

            git tag -f "v${MAJOR}" "${GITHUB_REF#refs/tags/}"
            git push -f origin "v${MAJOR}"
            echo "Updated tag: v${MAJOR}"

            git tag -f "v${MAJOR}.${MINOR}" "${GITHUB_REF#refs/tags/}"
            git push -f origin "v${MAJOR}.${MINOR}"
            echo "Updated tag: v${MAJOR}.${MINOR}"
          fi

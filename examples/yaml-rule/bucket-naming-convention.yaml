name: bucket-naming-convention
description: S3 bucket names must follow naming convention
severity: warning
enabled: true
tags:
  - aws
  - s3
  - naming
patterns:
  resource_types:
    - aws_s3_bucket
  attribute_patterns:
    - attribute: bucket
      pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
      message: "Bucket name must be 3-63 lowercase alphanumeric characters or hyphens"

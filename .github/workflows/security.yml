name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.x'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, GPL-3.0-only

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Check licenses
        run: go-licenses check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-2-Clause-FreeBSD,BSD-3-Clause,MIT,MPL-2.0,Unicode-DFS-2016

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.5

      # Exit 1 means "scanned fine, found vulnerabilities", which must not fail the
      # job: the SARIF upload is how those surface. Every other non-zero code is a
      # scanner failure -- notably 127 (general error) and 128 (no packages found,
      # i.e. the lockfile moved or stopped parsing) -- and has to be loud, because a
      # silent 128 would look identical to a clean scan. A blanket continue-on-error
      # cannot make that distinction, and it also leaves the upload below to fail on
      # a missing file instead of reporting the real problem.
      - name: Run osv-scanner on VSCode extension
        run: |
          code=0
          osv-scanner scan --lockfile=vscode/bun.lock --format=sarif --output-file=osv-results.sarif || code=$?
          if [ "$code" -eq 1 ]; then
            echo "osv-scanner reported vulnerabilities; see the code scanning results."
          elif [ "$code" -ne 0 ]; then
            echo "::error::osv-scanner failed with exit code $code" >&2
            exit "$code"
          fi

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  api-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for pkg/sdk changes
        uses: santosr2/conditional-paths-action@9c124632d1b141a351779440b22130f0c9806166 # v1.0.0
        id: filter
        with:
          filters: |
            sdk:
              - 'pkg/sdk/**'

      - name: Set up Go
        if: steps.filter.outputs.sdk == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install gorelease
        if: steps.filter.outputs.sdk == 'true'
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260312153236-7ab1446f8b90

      - name: Run API compatibility check
        if: steps.filter.outputs.sdk == 'true'
        continue-on-error: true  # Informational only - pre-1.0 has no BC guarantees
        run: gorelease -base="$(git describe --tags --abbrev=0 --match='v[0-9]*.[0-9]*.[0-9]*')"

name: VSCode Extension

# CI only. Marketplace publishing and .vsix release uploads live in release.yml,
# which already runs on v* tags and can order itself after the GitHub release exists.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-vscode-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change touches anything the jobs below test. The path
  # filter lives here rather than on the triggers so that the workflow always
  # starts: a workflow skipped by a trigger filter reports nothing, and a
  # required check that never reports blocks the pull request indefinitely.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # List the files a pull request changes
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/scripts

      - name: Match changed files
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: '^vscode/|^internal/lsp/|^\.github/workflows/vscode\.yml$|^tools/scripts/changed-files-match\.sh$'
        run: ./tools/scripts/changed-files-match.sh

  build-and-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Dependabot PRs need write access to push lockfile updates
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For Dependabot PRs, check out the branch head instead of the PR merge ref
          # so the regenerated bun.lock commits onto the branch tip and pushes back as a
          # fast-forward. Empty string falls back to the default (merge ref) for everyone else.
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}
          # Persist credentials for Dependabot lockfile commits
          persist-credentials: ${{ github.actor == 'dependabot[bot]' }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false  # Disable cache to prevent cache poisoning on PRs

      - name: Build TerraTidy binary
        run: |
          go build -o bin/terratidy ./cmd/terratidy
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.x"
          no-cache: true  # Disable cache to prevent cache poisoning on PRs

      - name: Install dependencies
        working-directory: vscode
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
            # Dependabot can't update bun.lock (binary), so regenerate it
            bun install
          else
            bun install --frozen-lockfile
          fi

      # zizmor: ignore[bot-conditions] - Dependabot PRs are trusted, actor check is intentional
      - name: Commit updated lockfile (Dependabot only)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && matrix.os == 'ubuntu-latest'
        working-directory: vscode
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet bun.lock; then
            echo "No lockfile changes to commit"
          else
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(vscode): update bun.lock for Dependabot PR"
            # Push explicitly to the PR head ref (checkout above put us on the branch tip)
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Lint
        working-directory: vscode
        run: bun run lint

      - name: Compile
        working-directory: vscode
        run: bun run compile

      # vscode-test looks up the latest VS Code release on every run. On hosted
      # runners that lookup intermittently fails about 300 ms in: Node tries the
      # service's IPv6 and IPv4 addresses with a 250 ms limit on each and gives up.
      # test-electron copes with a failed lookup by falling back to a copy already
      # in .vscode-test/, but a fresh runner has none, so the error ends the job.
      #
      # Downloading here first means the test step always has that copy. The longer
      # per-address limit is set only for this step, never for the tests:
      # test-electron hands NODE_OPTIONS on to VS Code itself, and Electron accepts
      # only some Node options. It is also skipped if the runner's Node predates the
      # flag, because Node refuses to start with an option it doesn't know.
      - name: Download VS Code for tests
        working-directory: vscode
        run: |
          if node --help | grep -q -- '--network-family-autoselection-attempt-timeout'; then
            export NODE_OPTIONS=--network-family-autoselection-attempt-timeout=5000
          fi
          for attempt in 1 2 3; do
            if node -e "require('@vscode/test-electron').download().then((p) => console.log('VS Code ready:', p))"; then
              exit 0
            fi
            echo "::warning::VS Code download attempt ${attempt} failed"
            sleep $((attempt * 10))
          done
          echo "::error::Could not download VS Code after 3 attempts" >&2
          exit 1

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: vscode
        run: xvfb-run -a bun run test

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: vscode
        run: bun run test

      - name: Package extension
        working-directory: vscode
        run: bun run package

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terratidy-vsix-${{ matrix.os }}
          path: vscode/*.vsix
          retention-days: 7

  # The one check to require for this workflow. It waits on every other job and
  # passes only if each one succeeded or was skipped because the change did not
  # touch what it tests. It uses always() rather than !cancelled() on purpose: a
  # cancelled run has to fail this check, whereas a skipped required check would
  # count as passing.
  result:
    name: VS Code result
    if: always()
    needs: [changes, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r 'to_entries[]
            | select((.key == "changes" and .value.result != "success")
                     or (.value.result != "success" and .value.result != "skipped"))
            | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi

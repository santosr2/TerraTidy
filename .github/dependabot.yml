version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - dependencies
      - go
    cooldown:
      default-days: 7
    groups:
      # golang.org/x/* modules are released in lockstep and their advisories tend
      # to land together, so a single PR is easier to review than one per module.
      # `applies-to` is required: a group without it silently becomes a
      # version-updates group and never touches a security fix.
      golang-x-security:
        applies-to: security-updates
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "vscode"
      include: "scope"
    labels:
      - dependencies
      - vscode
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "container"
      include: "scope"
    labels:
      - dependencies
      - docker
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    groups:
      # init, analyze and upload-sarif ship as one release of github/codeql-action,
      # but Dependabot sees three dependencies. init stamps its version into the
      # config analyze reads, and analyze refuses a mismatch, so a PR that bumps
      # only one of them fails, and so does its sibling. Each group covers one
      # update type, hence the pair (see the golang.org/x/* group above).
      codeql-action:
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
      # The docker/* actions are separate repos with no version constraint between
      # them, unlike codeql-action above: matching version numbers are a
      # coincidence, and they drift (setup-buildx reached 4.4.1 while setup-qemu
      # stayed on 4.4.0). Grouped only to land one PR instead of four. Nothing here
      # runs outside release.yml, so no pull request exercises these bumps.
      docker-actions:
        patterns:
          - "docker/*"
      docker-actions-security:
        applies-to: security-updates
        patterns:
          - "docker/*"

  # Hash-pinned CI/docs tooling lockfiles (uv pip compile output).
  # .github/requirements: pre-commit + pyyaml for precommit-test.yml.
  # docs/site: mkdocs stack for the docs build.
  - package-ecosystem: pip
    directories:
      - /.github/requirements
      - /docs/site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - dependencies
      - ci
      - python
    cooldown:
      default-days: 7

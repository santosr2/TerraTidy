version: 1

engines:
  fmt:
    enabled: true
  style:
    enabled: true
    # Rule configuration for testing
    rules:
      style.resource-name-convention:
        enabled: true
        severity: warning
  lint:
    enabled: false
  policy:
    enabled: false

severity_threshold: warning

# Profile for testing profile selection
profiles:
  strict:
    engines:
      lint:
        enabled: true
      policy:
        enabled: true

name: VSCode Extension

on:
  push:
    branches: [main]
    paths:
      - "vscode/**"
      - "internal/lsp/**"
      - ".github/workflows/vscode.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "vscode/**"
      - "internal/lsp/**"
      - ".github/workflows/vscode.yml"

permissions:
  contents: read

concurrency:
  group: ci-vscode-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"

      - name: Build TerraTidy binary
        run: |
          go build -o bin/terratidy ./cmd/terratidy
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        working-directory: vscode
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: vscode
        run: bun run lint

      - name: Compile
        working-directory: vscode
        run: bun run compile

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: vscode
        run: xvfb-run -a bun run test

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: vscode
        run: bun run test

      - name: Package extension
        working-directory: vscode
        run: bun run package

      - name: Upload VSIX
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: terratidy-vsix-${{ matrix.os }}
          path: vscode/*.vsix
          retention-days: 7

  # Publish to VS Code Marketplace on release tags
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        working-directory: vscode
        run: bun install --frozen-lockfile

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-alpha* ]] || [[ "$TAG" == *-beta* ]] || [[ "$TAG" == *-rc* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected pre-release tag: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable tag: $TAG"
          fi

      - name: Package extension (pre-release)
        if: steps.prerelease.outputs.is_prerelease == 'true'
        working-directory: vscode
        run: bunx @vscode/vsce package --pre-release

      - name: Package extension (stable)
        if: steps.prerelease.outputs.is_prerelease == 'false'
        working-directory: vscode
        run: bunx @vscode/vsce package

      - name: Publish to VS Code Marketplace (pre-release)
        if: steps.prerelease.outputs.is_prerelease == 'true'
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --pre-release --packagePath *.vsix

      - name: Publish to VS Code Marketplace (stable)
        if: steps.prerelease.outputs.is_prerelease == 'false'
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --packagePath *.vsix

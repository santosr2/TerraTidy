name: 'TerraTidy'
description: 'Run TerraTidy to lint, format, and enforce style in your Terraform/Terragrunt code'
author: 'santosr2'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  version:
    description: 'TerraTidy version to use (e.g., v0.2.0-alpha.3, latest)'
    required: false
    default: 'latest'
  config:
    description: 'Path to TerraTidy configuration file'
    required: false
    default: '.terratidy.yaml'
  profile:
    description: 'Configuration profile to use'
    required: false
    default: ''
  format:
    description: 'Output format (text, table, json, json-compact, sarif, html, junit, markdown, github)'
    required: false
    default: 'text'
  parallel:
    description: 'Run engines in parallel for faster execution'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory to run TerraTidy in'
    required: false
    default: '.'
  skip-fmt:
    description: 'Skip formatting checks'
    required: false
    default: 'false'
  skip-style:
    description: 'Skip style checks'
    required: false
    default: 'false'
  skip-lint:
    description: 'Skip linting checks'
    required: false
    default: 'false'
  skip-policy:
    description: 'Skip policy checks'
    required: false
    default: 'false'
  fail-on-error:
    description: 'Fail the action if errors are found'
    required: false
    default: 'true'
  fail-on-warning:
    description: 'Fail the action if warnings are found'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for PR annotations'
    required: false
    default: ''

outputs:
  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.terratidy.outputs.findings-count }}
  errors-count:
    description: 'Number of error-level findings'
    value: ${{ steps.terratidy.outputs.errors-count }}
  warnings-count:
    description: 'Number of warning-level findings'
    value: ${{ steps.terratidy.outputs.warnings-count }}
  sarif-file:
    description: 'Path to SARIF output file (if sarif format used)'
    value: ${{ steps.terratidy.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.1'
        cache: false

    - name: Install TerraTidy
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" = "latest" ]; then
          # Check if we're in a terratidy checkout (for action testing)
          if [ -f "go.mod" ] && grep -q "github.com/santosr2/terratidy" go.mod 2>/dev/null; then
            # Build from source for local testing
            # Get version info for ldflags (shallow clones don't have VCS info)
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
            COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
            go build -ldflags "${LDFLAGS}" -o "$(go env GOPATH)/bin/terratidy" ./cmd/terratidy
          else
            go install github.com/santosr2/terratidy/cmd/terratidy@latest
          fi
        else
          go install "github.com/santosr2/terratidy/cmd/terratidy@${INPUT_VERSION}"
        fi
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Run TerraTidy
      id: terratidy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_SKIP_FMT: ${{ inputs.skip-fmt }}
        INPUT_SKIP_STYLE: ${{ inputs.skip-style }}
        INPUT_SKIP_LINT: ${{ inputs.skip-lint }}
        INPUT_SKIP_POLICY: ${{ inputs.skip-policy }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        # Build command arguments
        ARGS=""

        # Config file
        if [ -f "$INPUT_CONFIG" ]; then
          ARGS="$ARGS --config $INPUT_CONFIG"
        fi

        # Profile
        if [ -n "$INPUT_PROFILE" ]; then
          ARGS="$ARGS --profile $INPUT_PROFILE"
        fi

        # Skip flags
        if [ "$INPUT_SKIP_FMT" = "true" ]; then
          ARGS="$ARGS --skip-fmt"
        fi
        if [ "$INPUT_SKIP_STYLE" = "true" ]; then
          ARGS="$ARGS --skip-style"
        fi
        if [ "$INPUT_SKIP_LINT" = "true" ]; then
          ARGS="$ARGS --skip-lint"
        fi
        if [ "$INPUT_SKIP_POLICY" = "true" ]; then
          ARGS="$ARGS --skip-policy"
        fi

        # Parallel mode
        if [ "$INPUT_PARALLEL" = "true" ]; then
          ARGS="$ARGS --parallel"
        fi

        # Output format
        FORMAT="$INPUT_FORMAT"
        ARGS="$ARGS --format $FORMAT"

        # SARIF output file
        SARIF_FILE=""
        SARIF_OUTPUT_PATH=""
        if [ "$FORMAT" = "sarif" ]; then
          # Local filename for terratidy to write to (relative to working directory)
          SARIF_FILE="terratidy-results.sarif"
          # Full path from repo root for the upload step
          SARIF_OUTPUT_PATH="${INPUT_WORKING_DIRECTORY}/terratidy-results.sarif"
          # Normalize path (remove leading ./ if present)
          SARIF_OUTPUT_PATH="${SARIF_OUTPUT_PATH#./}"
          echo "sarif-file=$SARIF_OUTPUT_PATH" >> $GITHUB_OUTPUT
        fi

        # Run TerraTidy and capture output
        set +e
        if [ "$FORMAT" = "sarif" ]; then
          # Redirect only stdout to SARIF file, stderr to a temp file for display
          terratidy check $ARGS > "$SARIF_FILE" 2>/tmp/terratidy-stderr.txt
          EXIT_CODE=$?
          # Display stderr (progress messages) to the log
          cat /tmp/terratidy-stderr.txt || true
          OUTPUT=$(cat "$SARIF_FILE")
        elif [ "$FORMAT" = "json" ] || [ "$FORMAT" = "json-compact" ]; then
          # For JSON formats, capture stdout separately from stderr
          terratidy check $ARGS > /tmp/terratidy-output.json 2>/tmp/terratidy-stderr.txt
          EXIT_CODE=$?
          # Display stderr (progress messages) to the log
          cat /tmp/terratidy-stderr.txt || true
          OUTPUT=$(cat /tmp/terratidy-output.json)
        else
          OUTPUT=$(terratidy check $ARGS 2>&1)
          EXIT_CODE=$?
        fi
        set -e

        echo "$OUTPUT"

        # Parse findings counts from JSON output
        if [ "$FORMAT" = "json" ] || [ "$FORMAT" = "json-compact" ]; then
          FINDINGS=$(echo "$OUTPUT" | jq -r '.summary.total // 0')
          ERRORS=$(echo "$OUTPUT" | jq -r '.summary.errors // 0')
          WARNINGS=$(echo "$OUTPUT" | jq -r '.summary.warnings // 0')
        else
          # For other formats, use exit code heuristics
          FINDINGS=$EXIT_CODE
          ERRORS=0
          WARNINGS=0
          if [ $EXIT_CODE -ne 0 ]; then
            ERRORS=$EXIT_CODE
          fi
        fi

        echo "findings-count=$FINDINGS" >> $GITHUB_OUTPUT
        echo "errors-count=$ERRORS" >> $GITHUB_OUTPUT
        echo "warnings-count=$WARNINGS" >> $GITHUB_OUTPUT

        # Determine if we should fail
        SHOULD_FAIL=false

        if [ "$INPUT_FAIL_ON_ERROR" = "true" ] && [ "$ERRORS" -gt 0 ]; then
          SHOULD_FAIL=true
        fi

        if [ "$INPUT_FAIL_ON_WARNING" = "true" ] && [ "$WARNINGS" -gt 0 ]; then
          SHOULD_FAIL=true
        fi

        if [ "$SHOULD_FAIL" = "true" ]; then
          exit 1
        fi

    - name: Upload SARIF
      if: inputs.format == 'sarif' && inputs.github-token != ''
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
      with:
        sarif_file: ${{ steps.terratidy.outputs.sarif-file }}

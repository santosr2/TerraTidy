name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false  # Disable cache to prevent cache poisoning on tag-triggered releases

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for the multi-arch (linux/amd64 + linux/arm64) Docker builds in
      # .goreleaser.yml: QEMU emulates arm64 on the amd64 runner, buildx drives it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign checksums with cosign
        run: cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.bundle

      - name: Upload cosign artifacts
        run: |
          gh release upload "$TAG_NAME" dist/checksums.txt.bundle --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/checksums.txt'

  trivy-scan:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/santosr2/terratidy:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: 'trivy-results.sarif'

  parse-version:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse version from tag
        id: parse
        run: |
          FULL_VERSION="${TAG_NAME#v}"
          BASE_VERSION="${FULL_VERSION%%-*}"
          if [ "$BASE_VERSION" = "$FULL_VERSION" ]; then
            PRERELEASE=""
          else
            PRERELEASE="${FULL_VERSION#*-}"
            PRERELEASE="${PRERELEASE%%.*}"
          fi
          MAJOR="${BASE_VERSION%%.*}"
          MINOR="${BASE_VERSION#*.}"
          MINOR="${MINOR%%.*}"

          {
            echo "tag=$TAG_NAME"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Parsed: tag=$TAG_NAME major=$MAJOR minor=$MINOR prerelease=$PRERELEASE"
        env:
          TAG_NAME: ${{ github.ref_name }}

  update-changelog:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Generate full changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${TAG_NAME}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  update-version-tags:
    needs: [parse-version, goreleaser]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: version-tags-v${{ needs.parse-version.outputs.major }}.${{ needs.parse-version.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version alias tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          if [[ -n "$PRERELEASE" ]]; then
            echo "Pre-release detected: $PRERELEASE"

            git tag -f "v${MAJOR}-${PRERELEASE}" "$TAG"
            git push -f origin "v${MAJOR}-${PRERELEASE}"

            git tag -f "v${MAJOR}.${MINOR}-${PRERELEASE}" "$TAG"
            git push -f origin "v${MAJOR}.${MINOR}-${PRERELEASE}"
          else
            echo "Stable release detected"

            git tag -f "v${MAJOR}" "$TAG"
            git push -f origin "v${MAJOR}"

            git tag -f "v${MAJOR}.${MINOR}" "$TAG"
            git push -f origin "v${MAJOR}.${MINOR}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.parse-version.outputs.tag }}
          MAJOR: ${{ needs.parse-version.outputs.major }}
          MINOR: ${{ needs.parse-version.outputs.minor }}
          PRERELEASE: ${{ needs.parse-version.outputs.prerelease }}

  update-docker-tags:
    needs: [parse-version, goreleaser]
    if: needs.parse-version.outputs.prerelease != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Update Docker alias tags
        run: |
          crane auth login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"

          crane tag "${IMAGE}:${TAG}" "v${MAJOR}-${PRERELEASE}"
          echo "Updated Docker tag: v${MAJOR}-${PRERELEASE}"

          crane tag "${IMAGE}:${TAG}" "v${MAJOR}.${MINOR}-${PRERELEASE}"
          echo "Updated Docker tag: v${MAJOR}.${MINOR}-${PRERELEASE}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/santosr2/terratidy
          TAG: ${{ needs.parse-version.outputs.tag }}
          MAJOR: ${{ needs.parse-version.outputs.major }}
          MINOR: ${{ needs.parse-version.outputs.minor }}
          PRERELEASE: ${{ needs.parse-version.outputs.prerelease }}

  smoke-test:
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout test fixtures
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: testdata
          persist-credentials: false

      - name: Download released binary
        run: |
          gh release download "$TAG_NAME" --repo santosr2/terratidy \
            -p "terratidy-*-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            -D /tmp/terratidy-release
          tar -xzf /tmp/terratidy-release/terratidy-*.tar.gz -C /tmp/terratidy-release
          chmod +x /tmp/terratidy-release/terratidy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Verify version
        run: /tmp/terratidy-release/terratidy version

      - name: Run check on test fixtures
        run: /tmp/terratidy-release/terratidy check --format text testdata/ || true

  test-homebrew:
    needs: goreleaser
    if: "!contains(github.ref, '-')"
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Test Homebrew formula
        run: |
          brew install --build-from-source Formula/terratidy.rb
          terratidy version

  # Every tag attaches the .vsix to the GitHub release. Only stable tags publish to
  # the VS Code Marketplace; pre-release testers install the .vsix manually.
  # Depends on goreleaser so the GitHub release is guaranteed to exist before upload.
  vscode-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write  # Required to upload the .vsix to the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.x"
          no-cache: true  # Disable cache for security-sensitive publish job

      - name: Install dependencies
        working-directory: vscode
        run: bun install --frozen-lockfile

      # vsce package bundles via esbuild, which strips types without checking them.
      # Type-check explicitly: a Marketplace version cannot be unpublished.
      - name: Type check
        working-directory: vscode
        run: bun run compile

      - name: Package extension
        working-directory: vscode
        run: bunx @vscode/vsce package --out terratidy.vsix

      - name: Attach VSIX to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" vscode/terratidy.vsix --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to VS Code Marketplace
        if: "!contains(github.ref, '-')"
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --packagePath ./terratidy.vsix

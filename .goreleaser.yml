version: 2

project_name: terratidy

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: terratidy
    binary: terratidy
    main: ./cmd/terratidy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: terratidy
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Changelog is generated by git-cliff and passed via --release-notes
# Note: Do NOT use disable: true as it ignores --release-notes file
# Instead, we use filters to exclude all commits so goreleaser generates nothing
changelog:
  filters:
    exclude:
      - ".*"

release:
  github:
    owner: santosr2
    name: terratidy
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## TerraTidy {{ .Version }}

    {{ if .Prerelease }}⚠️ **This is a pre-release version.** It may contain bugs and breaking changes.{{ end }}

    ### Installation

    ```bash
    # Homebrew (macOS/Linux)
    brew install santosr2/tap/terratidy

    # Go install
    go install github.com/santosr2/terratidy/cmd/terratidy@{{ .Tag }}

    # Docker
    docker pull ghcr.io/santosr2/terratidy:{{ .Tag }}
    ```

    ### Pre-commit Hook

    ```yaml
    # .pre-commit-config.yaml
    repos:
      - repo: https://github.com/santosr2/terratidy
        rev: {{ .Tag }}
        hooks:
          - id: terratidy-check
    ```

    ### GitHub Action

    ```yaml
    - uses: santosr2/TerraTidy@{{ .Tag }}
      with:
        format: text
    ```

    ### VSCode Extension

    Install from the [VSCode Marketplace](https://marketplace.visualstudio.com/items?itemName=santosr2.terratidy) or search "TerraTidy" in VSCode extensions.

    ---

    ## What's Changed
  footer: |
    ---

    ## Documentation

    - 📖 [User Guide](https://santosr2.github.io/TerraTidy/)
    - 📋 [Full Changelog](https://github.com/santosr2/terratidy/blob/main/CHANGELOG.md)
    - 🐛 [Report Issues](https://github.com/santosr2/terratidy/issues)

    ---

    **Full Changelog**: https://github.com/santosr2/terratidy/compare/{{ .PreviousTag }}...{{ .Tag }}

brews:
  - name: terratidy
    # Only publish stable releases to Homebrew
    skip_upload: '{{ if .Prerelease }}true{{ else }}false{{ end }}'
    repository:
      owner: santosr2
      name: TerraTidy
    directory: Formula
    homepage: https://github.com/santosr2/terratidy
    description: "Terraform/Terragrunt quality platform"
    license: MIT
    test: |
      system "#{bin}/terratidy version"
    install: |
      bin.install "terratidy"

# Docker images for stable releases
dockers:
  - id: docker-stable
    skip_push: '{{ if .Prerelease }}true{{ else }}false{{ end }}'
    image_templates:
      - "ghcr.io/santosr2/terratidy:{{ .Tag }}"
      - "ghcr.io/santosr2/terratidy:v{{ .Major }}"
      - "ghcr.io/santosr2/terratidy:v{{ .Major }}.{{ .Minor }}"
      - "ghcr.io/santosr2/terratidy:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  # Docker images for pre-releases (only tag-specific, no aliases)
  - id: docker-prerelease
    skip_push: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
    image_templates:
      - "ghcr.io/santosr2/terratidy:{{ .Tag }}"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

version: 1

engines:
  fmt:
    enabled: true
  style:
    enabled: true
  lint:
    enabled: false
  policy:
    enabled: false

severity_threshold: warning

# Profile for testing profile selection
profiles:
  strict:
    engines:
      lint:
        enabled: true
      policy:
        enabled: true

# Override example for testing rule configuration
overrides:
  rules:
    style.block-label-case:
      enabled: true
      severity: warning

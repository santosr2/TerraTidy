version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - dependencies
      - go
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "vscode"
      include: "scope"
    labels:
      - dependencies
      - vscode
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "container"
      include: "scope"
    labels:
      - dependencies
      - docker
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7

  # Hash-pinned CI/docs tooling lockfiles (uv pip compile output).
  # .github/requirements: pre-commit + pyyaml for precommit-test.yml.
  # docs/site: mkdocs stack for the docs build.
  - package-ecosystem: pip
    directories:
      - /.github/requirements
      - /docs/site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 7

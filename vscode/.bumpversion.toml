# VSCode Extension Versioning
#
# VSCode Marketplace requires numeric-only versions (X.Y.Z) without semver
# pre-release suffixes. This config manages VSCode versions independently
# from the main Go project versioning.
#
# Version scheme:
# - major.minor always matches Go project (synchronized manually)
# - patch increments only when publishing to the Marketplace
# - Only stable Go releases publish to the Marketplace. Pre-release tags attach
#   the .vsix to the GitHub release instead, so they consume no version number.
#
# Examples:
#   Go 0.2.0-alpha.4 → VSCode 0.2.0 (Marketplace, published during alpha cycle)
#   Go 0.2.0         → VSCode 0.2.1 (Marketplace; offset by one, 0.2.0 was taken)
#   Go 0.3.0         → VSCode 0.3.0 (Marketplace; versions realign here)
#   Go 0.4.0-alpha.1 → VSCode 0.4.0 (GitHub .vsix only)
#   Go 0.4.0         → VSCode 0.4.0 (Marketplace)
#
# Usage:
#   mise run vscode:bump:patch   # Increment patch for next publish
#   mise run vscode:bump:minor   # Reset patch when Go bumps minor
#   mise run vscode:bump:major   # Reset patch when Go bumps major

[tool.bumpversion]
current_version = "0.2.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = false
message = "chore(vscode): bump extension version to {new_version}"

[[tool.bumpversion.files]]
filename = "package.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

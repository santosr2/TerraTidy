# Example .pre-commit-config.yaml for TerraTidy
#
# Installation:
#   1. Install pre-commit: pip install pre-commit
#   2. Copy this file to .pre-commit-config.yaml
#   3. Run: pre-commit install
#
# Usage:
#   - Runs automatically on git commit
#   - Manual run: pre-commit run --all-files
#   - Update hooks: pre-commit autoupdate

repos:
  # TerraTidy hooks
  - repo: https://github.com/santosr2/terratidy
    rev: v0.2.0-alpha.3
    hooks:
      - id: terratidy-fmt
      - id: terratidy-style
      - id: terratidy-lint
      # Or use terratidy-check for all checks at once:
      # - id: terratidy-check

  # Optional: Standard Terraform hooks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.5
    hooks:
      - id: terraform_validate
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

# Configuration
default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - commit

# Skip specific hooks (example)
# SKIP=terratidy-lint git commit -m "Skip lint"

name: Container Tests

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/container-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/container-test.yml'

permissions:
  contents: read

concurrency:
  group: ci-container-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: terratidy-test

jobs:
  build-test:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o terratidy ./cmd/terratidy

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_NAME:latest" .

      - name: Verify image exists
        run: |
          docker images "$IMAGE_NAME:latest" --format "{{.Repository}}:{{.Tag}}"
          if ! docker images -q "$IMAGE_NAME:latest" | grep -q .; then
            echo "::error::Docker image was not built"
            exit 1
          fi
          echo "Docker build succeeded"

      - name: Save Docker image
        run: |
          docker save "$IMAGE_NAME:latest" | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  run-test:
    name: Container Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Run terratidy version
        run: |
          OUTPUT=$(docker run --rm "$IMAGE_NAME:latest" version)
          echo "Version output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -qi "terratidy"; then
            echo "::error::Expected 'terratidy' in version output"
            exit 1
          fi
          echo "Container version command succeeded"

  check-test:
    name: Container Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Create test Terraform files
        run: |
          mkdir -p test-terraform
          printf '%s\n' \
            'terraform {' \
            '  required_version = ">= 1.0"' \
            '}' \
            '' \
            'resource "aws_instance" "example" {' \
            '  ami           = "ami-12345678"' \
            '  instance_type = "t2.micro"' \
            '}' > test-terraform/main.tf

      - name: Run terratidy check in container
        run: |
          docker run --rm -v "$PWD/test-terraform:/app/terraform:ro" "$IMAGE_NAME:latest" check /app/terraform --format=json || true
          echo "Container check command executed"

      - name: Verify container can process files
        run: |
          # Run check and capture output (exit code may be non-zero due to findings)
          OUTPUT=$(docker run --rm -v "$PWD/test-terraform:/app/terraform:ro" "$IMAGE_NAME:latest" check /app/terraform --format=json 2>&1) || true
          echo "Check output: $OUTPUT"
          # Verify we got valid JSON output (not an error message)
          if echo "$OUTPUT" | grep -q '"findings"'; then
            echo "Container successfully processed Terraform files"
          elif echo "$OUTPUT" | grep -q "no HCL files found"; then
            echo "::error::Container could not find mounted files"
            exit 1
          else
            echo "Container executed (output may vary based on file content)"
          fi

  healthcheck-test:
    name: Container Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Verify healthcheck is defined
        run: |
          HEALTHCHECK=$(docker inspect "$IMAGE_NAME:latest" --format='{{json .Config.Healthcheck}}')
          echo "Healthcheck config: $HEALTHCHECK"
          if [ "$HEALTHCHECK" = "null" ]; then
            echo "::error::No healthcheck defined in Dockerfile"
            exit 1
          fi
          echo "Healthcheck is defined"

      - name: Run container and verify healthcheck
        run: |
          # Start container in background with a long-running command
          # Override entrypoint since default is terratidy
          CONTAINER_ID=$(docker run -d --entrypoint sh "$IMAGE_NAME:latest" -c "sleep 120")
          echo "Started container: $CONTAINER_ID"

          # Poll for healthcheck to complete (timeout after 60s)
          # Dockerfile: start-period=5s, interval=30s, timeout=3s
          MAX_ATTEMPTS=20
          ATTEMPT=0
          HEALTH=""

          echo "Waiting for healthcheck..."
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HEALTH=$(docker inspect "$CONTAINER_ID" --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
            echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS: Health status = $HEALTH"

            if [ "$HEALTH" = "healthy" ]; then
              break
            elif [ "$HEALTH" = "unhealthy" ]; then
              echo "::error::Container healthcheck failed"
              docker logs "$CONTAINER_ID" 2>&1 || true
              docker stop "$CONTAINER_ID" > /dev/null 2>&1 || true
              docker rm "$CONTAINER_ID" > /dev/null 2>&1 || true
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done

          # Clean up
          docker stop "$CONTAINER_ID" > /dev/null 2>&1 || true
          docker rm "$CONTAINER_ID" > /dev/null 2>&1 || true

          if [ "$HEALTH" = "healthy" ]; then
            echo "Container healthcheck passed"
          else
            echo "::error::Container healthcheck did not reach healthy status within timeout (final status: $HEALTH)"
            exit 1
          fi

  non-root-test:
    name: Container Non-Root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load

      - name: Verify container runs as non-root
        run: |
          # Check the configured user
          USER=$(docker inspect "$IMAGE_NAME:latest" --format='{{.Config.User}}')
          echo "Configured user: $USER"

          if [ -z "$USER" ] || [ "$USER" = "root" ] || [ "$USER" = "0" ]; then
            echo "::error::Container should not run as root"
            exit 1
          fi

          # Verify at runtime
          RUNTIME_USER=$(docker run --rm --entrypoint sh "$IMAGE_NAME:latest" -c "whoami")
          echo "Runtime user: $RUNTIME_USER"

          if [ "$RUNTIME_USER" = "root" ]; then
            echo "::error::Container is running as root at runtime"
            exit 1
          fi

          # Verify UID is not 0
          RUNTIME_UID=$(docker run --rm --entrypoint sh "$IMAGE_NAME:latest" -c "id -u")
          echo "Runtime UID: $RUNTIME_UID"

          if [ "$RUNTIME_UID" = "0" ]; then
            echo "::error::Container is running with UID 0"
            exit 1
          fi

          echo "Container runs as non-root user: $RUNTIME_USER (UID: $RUNTIME_UID)"

# actionlint configuration
# https://github.com/rhysd/actionlint/blob/main/docs/config.md

self-hosted-runner:
  # No self-hosted runners in this project
  labels: []

config-variables: []

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub added the self-repository `uses: $/...` form in July 2026, and it
      # is now the recommended way to reference an action in the same repository.
      # actionlint has not learned the syntax yet (rhysd/actionlint#711, #732 are
      # both open, and upstream is currently unmaintained), so it reports every
      # such reference as a malformed action spec. Drop this entry once a release
      # understands the syntax.
      - 'specifying action "\$/.*" in invalid format because ref is missing'

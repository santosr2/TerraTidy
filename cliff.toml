# git-cliff configuration file
# https://git-cliff.org

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# template for the changelog body
# Uses PR number if available (from commit.remote.pr_number), otherwise falls back to commit SHA
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/santosr2/TerraTidy/pull/{{ commit.remote.pr_number }}))\
            {% elif commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/santosr2/TerraTidy/commit/{{ commit.id }})){% endif %}\
            {% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})\
            {% elif commit.author.name %} by [@{{ commit.author.name }}](https://github.com/{{ commit.author.name }}){% endif %}\
    {% endfor %}
{% endfor %}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
    ---

    ### New Contributors
    {% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
        - @{{ contributor.username }} made their first contribution\
            {% if contributor.pr_number %} in [#{{ contributor.pr_number }}](https://github.com/santosr2/TerraTidy/pull/{{ contributor.pr_number }}){% endif %}\
    {% endfor %}
{% endif %}
"""
# template for the changelog footer
# A blank line separates the link-reference definitions from the last list item.
# Without it markdown treats them as lazy continuation of that item and renders
# them as literal text instead of consuming them as link definitions.
footer = """

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/santosr2/TerraTidy/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: https://github.com/santosr2/TerraTidy/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor -%}
"""
# remove the leading and trailing s]
trim = true
# postprocessors
postprocessors = [
  # git-cliff joins release bodies with a single newline, gluing "## [x]" onto the
  # previous section's last line. Postprocessors run per release body, so anchor to
  # the body start (^) to prepend a blank line before every version header.
  { pattern = '^## \[', replace = "\n## [" },
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# Only consider full semver tags, exclude alias tags like v0-alpha, v0.2-alpha
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  # Strip PR numbers from commit message (they'll be added back via github integration)
  { pattern = '\s*\(#([0-9]+)\)', replace = "" },
]
# regex for parsing and grouping commits
# Breaking-change parsers are listed FIRST because git-cliff applies parsers
# in order and stops at the first match. A `feat!:` or `refactor!:` commit
# must route to "Breaking Changes" before the bare `^feat` / `^refactor`
# rules absorb it into Added/Changed.
commit_parsers = [
  { body = ".*BREAKING CHANGE", group = "Breaking Changes" },
  { message = "^[a-z]+(\\([^)]+\\))?!:", group = "Breaking Changes" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", group = "Dependencies" },
  { message = "^vscode\\(deps", group = "Dependencies" },
  { message = "^container\\(deps", group = "Dependencies" },
  { message = "^ci\\(deps", group = "Dependencies" },
  { message = "^ci", group = "CI/CD" },
  { message = "^deps", group = "Dependencies" },
  { message = "^chore", group = "Other" },
  { message = "^vscode", group = "VS Code Extension" },
  { message = "^container", group = "Container" },
  { body = ".*security", group = "Security" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = false
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog
# limit_commits = 42

[remote.github]
owner = "santosr2"
repo = "TerraTidy"

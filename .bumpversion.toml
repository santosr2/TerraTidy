[tool.bumpversion]
current_version = "0.3.0"
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (-(?P<pre_l>alpha|beta|rc)\\.?(?P<pre_n>0|[1-9]\\d*)?)?
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}.{pre_n}",
    "{major}.{minor}.{patch}-{pre_l}",
    "{major}.{minor}.{patch}",
]
commit = true
tag = false
message = "chore: bump version to {new_version}"

[tool.bumpversion.parts.pre_l]
optional_value = "final"
values = ["alpha", "beta", "rc", "final"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

# VSCode extension version is managed independently in vscode/.bumpversion.toml
# (marketplace requires numeric-only versions with independent patch increments)

# Documentation - commands
[[tool.bumpversion.files]]
filename = "docs/site/docs/user-guide/commands.md"
search = "TerraTidy version {current_version}"
replace = "TerraTidy version {new_version}"

# Documentation - output formats (updates all occurrences in file)
[[tool.bumpversion.files]]
filename = "docs/site/docs/user-guide/output-formats.md"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""
glob_exclude = []
regex = false

# Documentation - output formats footer
[[tool.bumpversion.files]]

name: "TerraTidy"
description: "Run TerraTidy to lint, format, and enforce style in your Terraform/Terragrunt code"
author: "santosr2"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  version:
    description: "TerraTidy version to use (e.g., v0.2.0, latest)"
    required: false
    default: "latest"
  config:
    description: "Path to TerraTidy configuration file"
    required: false
    default: ".terratidy.yaml"
  profile:
    description: "Configuration profile to use"
    required: false
    default: ""
  format:
    description: "Output format (text, table, json, json-compact, sarif, html, junit, markdown, github)"
    required: false
    default: "text"
  parallel:
    description: "Run engines in parallel for faster execution (defaults to false here for deterministic CI ordering, unlike the CLI which is parallel by default)"
    required: false
    default: "false"
  working-directory:
    description: "Working directory to run TerraTidy in"
    required: false
    default: "."
  skip-fmt:
    description: "Skip formatting checks"
    required: false
    default: "false"
  skip-style:
    description: "Skip style checks"
    required: false
    default: "false"
  skip-lint:
    description: "Skip linting checks"
    required: false
    default: "false"
  skip-policy:
    description: "Skip policy checks"
    required: false
    default: "false"
  exclude:
    description: "Glob patterns to exclude (comma-separated, e.g., '**/*.generated.tf,vendor/**')"
    required: false
    default: ""
  no-recurse:
    description: "Disable recursive directory traversal (scan only specified directories)"
    required: false
    default: "false"
  absolute-paths:
    description: "Output absolute file paths instead of relative"
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the action if errors are found"
    required: false
    default: "true"
  fail-on-warning:
    description: "Fail the action if warnings are found"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for PR annotations"
    required: false
    default: ""
  changed:
    description: "Only check files changed in git"
    required: false
    default: "false"
  severity-threshold:
    description: "Minimum severity level to report (info, warning, error)"
    required: false
    default: ""

outputs:
  findings-count:
    description: "Total number of findings (accurate for json/json-compact, or when fail-on-warning is enabled)"
    value: ${{ steps.terratidy.outputs.findings-count }}
  errors-count:
    description: "Number of error-level findings (accurate for json/json-compact, or when fail-on-warning is enabled)"
    value: ${{ steps.terratidy.outputs.errors-count }}
  warnings-count:
    description: "Number of warning-level findings (accurate for json/json-compact, or when fail-on-warning is enabled)"
    value: ${{ steps.terratidy.outputs.warnings-count }}
  sarif-file:
    description: "Path to SARIF output file (if sarif format used)"
    value: ${{ steps.terratidy.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26.x"
        cache: false  # Prevents gtar conflicts on macOS when action is called multiple times

    - name: Install TerraTidy
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: | # zizmor: ignore[github-env]
        if [ "$INPUT_VERSION" = "latest" ]; then
          # Check if we're in the terratidy checkout itself (for action testing).
          # Match the module declaration, not a substring: any SDK consumer lists
          # github.com/santosr2/TerraTidy as a require, and must not build from source.
          if [ -f "go.mod" ] && head -n1 go.mod | grep -qx "module github.com/santosr2/TerraTidy" 2>/dev/null; then
            # Build from source for local testing
            # Get version info for ldflags (shallow clones don't have VCS info)
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
            COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
            go build -ldflags "${LDFLAGS}" -o "$(go env GOPATH)/bin/terratidy" ./cmd/terratidy
          else
            go install github.com/santosr2/TerraTidy/cmd/terratidy@latest
          fi
        else
          go install "github.com/santosr2/TerraTidy/cmd/terratidy@${INPUT_VERSION}"
        fi
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Run TerraTidy
      id: terratidy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_SKIP_FMT: ${{ inputs.skip-fmt }}
        INPUT_SKIP_STYLE: ${{ inputs.skip-style }}
        INPUT_SKIP_LINT: ${{ inputs.skip-lint }}
        INPUT_SKIP_POLICY: ${{ inputs.skip-policy }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_NO_RECURSE: ${{ inputs.no-recurse }}
        INPUT_ABSOLUTE_PATHS: ${{ inputs.absolute-paths }}
        INPUT_CHANGED: ${{ inputs.changed }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: $GITHUB_ACTION_PATH/tools/scripts/run-action.sh

    - name: Upload SARIF
      if: always() && inputs.format == 'sarif' && inputs.github-token != ''
      uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
      with:
        sarif_file: ${{ steps.terratidy.outputs.sarif-file }}

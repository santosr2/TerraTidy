version: 2

project_name: terratidy

before:
  hooks:
    - go mod tidy
    - go mod download
    # Generate version.json for embedded build info. .CommitDate, not .Date:
    # this file is go:embed-ed into the binary, so a wall-clock timestamp here
    # lands in the compiled bytes and makes every rebuild of the same tag differ.
    - sh -c 'echo "{\"version\":\"{{.Version}}\",\"commit\":\"{{.Commit}}\",\"date\":\"{{.CommitDate}}\"}" > internal/buildinfo/version.json'

builds:
  - id: terratidy
    binary: terratidy
    main: ./cmd/terratidy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # The three settings below are what make a release rebuildable from its tag,
    # together with the Go patch pinned in .go-version. -trimpath drops the
    # builder's absolute paths, CommitDate replaces the wall-clock build time
    # that would otherwise differ on every run, and mod_timestamp pins the output
    # file's mtime so the archives hash the same too. See the rebuild procedure in
    # docs/site/docs/getting-started/verification.md.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
      - -X github.com/santosr2/TerraTidy/internal/buildinfo.Version={{.Version}}
      - -X github.com/santosr2/TerraTidy/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/santosr2/TerraTidy/internal/buildinfo.Date={{.CommitDate}}

archives:
  - id: terratidy
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

# Changelog is generated by git-cliff and passed via --release-notes
# Note: Do NOT use disable: true as it ignores --release-notes file
# Instead, we use filters to exclude all commits so goreleaser generates nothing
changelog:
  filters:
    exclude:
      - ".*"

release:
  github:
    owner: santosr2
    name: terratidy
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## TerraTidy {{ .Version }}

    {{ if .Prerelease }}⚠️ **This is a pre-release version.** It may contain bugs and breaking changes.{{ end }}

    ### Installation

    ```bash
    # Homebrew (macOS/Linux)
    brew tap santosr2/tap https://github.com/santosr2/TerraTidy
    brew install santosr2/tap/terratidy

    # Go install
    go install github.com/santosr2/TerraTidy/cmd/terratidy@{{ .Tag }}

    # Docker
    docker pull ghcr.io/santosr2/terratidy:{{ .Tag }}
    ```

    ### Pre-commit Hook

    ```yaml
    # .pre-commit-config.yaml
    repos:
      - repo: https://github.com/santosr2/TerraTidy
        rev: {{ .Tag }}
        hooks:
          - id: terratidy-check
    ```

    ### GitHub Action

    ```yaml
    - uses: santosr2/TerraTidy@{{ .Tag }}
      with:
        format: text
    ```

    ### VSCode Extension

    Install from the [VSCode Marketplace](https://marketplace.visualstudio.com/items?itemName=santosr2.vscode-terratidy) or search "TerraTidy" in VSCode extensions.

    ---

    ## What's Changed
  footer: |
    ---

    ## Documentation

    - 📖 [User Guide](https://santosr2.github.io/TerraTidy/)
    - 📋 [Full Changelog](https://github.com/santosr2/TerraTidy/blob/main/CHANGELOG.md)
    - 🐛 [Report Issues](https://github.com/santosr2/TerraTidy/issues)

    ---

    **Full Changelog**: https://github.com/santosr2/TerraTidy/compare/{{ .PreviousTag }}...{{ .Tag }}

# Casks, not formulas: GoReleaser deprecated `brews`, and the Linuxbrew
# limitation that made formulas the only option for pre-built binaries no longer
# applies, so this covers macOS and Linux alike.
#
# Published to the standalone santosr2/homebrew-tap repository, which needs a
# token that can write to a different repo than the one running the workflow.
# GITHUB_TOKEN is scoped to this repository only and will 403.
homebrew_casks:
  - name: terratidy
    # Only publish stable releases to Homebrew
    skip_upload: "{{ if .Prerelease }}true{{ else }}false{{ end }}"
    repository:
      owner: santosr2
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/santosr2/TerraTidy
    description: "Terraform/Terragrunt quality platform"
    hooks:
      post:
        # The released binaries are neither signed nor notarized, so without
        # clearing the quarantine attribute every macOS install reports the
        # binary as damaged.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/terratidy"]
          end

# Multi-platform image built and pushed in one buildx step. dockers_v2 replaces
# the old per-architecture `dockers` entries plus `docker_manifests` merge, so
# the intermediate :<tag>-amd64 / :<tag>-arm64 tags are no longer published.
# buildx + QEMU are set up in release.yml.
#
# The tag-specific image ships for every release; the floating aliases
# (vMAJOR, vMAJOR.MINOR, latest) are stable-only. A tag template that renders
# empty is dropped, which is how the prerelease gating works here.
dockers_v2:
  - images:
      - "ghcr.io/santosr2/terratidy"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.description: "Single-binary Terraform/Terragrunt quality platform"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.source: "https://github.com/santosr2/TerraTidy"
      org.opencontainers.image.url: "https://github.com/santosr2/TerraTidy"
      org.opencontainers.image.documentation: "https://santosr2.github.io/TerraTidy/"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.vendor: "santosr2"

name: Benchmark

on:
  # Run on main pushes to update baseline
  push:
    branches: [main]
    paths:
      - 'benchmarks/baseline.txt'
  # Run on PRs when labeled, opened with label, or new commits to labeled PR
  pull_request:
    types: [opened, labeled, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-benchmark-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Run on push, or on PR if 'benchmark' label exists
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=6 -run=^$ ./internal/... \
            | tee benchmarks/current.txt

      - name: Compare with baseline
        id: compare
        run: |
          {
            echo "## Benchmark Comparison"
            echo ""
            echo '```'
            benchstat benchmarks/baseline.txt benchmarks/current.txt | tee comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Check for significant regressions (>15% slower)
          if grep -E '\+[0-9]{2,}\.[0-9]+%' comparison.txt | grep -v '~'; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "**Warning:** Significant performance regression detected (>15%)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "No significant regressions detected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REGRESSION: ${{ steps.compare.outputs.regression }}
        with:
          script: |
            const fs = require('fs');
            const comparison = fs.readFileSync('comparison.txt', 'utf8');
            const regression = process.env.REGRESSION === 'true';
            const marker = '<!-- benchmark-results -->';

            const body = `${marker}
            ## Benchmark Results

            <details>
            <summary>${regression ? '⚠️ Performance regression detected' : '✅ No significant regressions'}</summary>

            \`\`\`
            ${comparison}
            \`\`\`

            </details>

            ${regression ? '**Note:** Please review the benchmark changes before merging.' : ''}
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail on regression
        if: steps.compare.outputs.regression == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::Significant performance regression detected. Please review benchmarks."
          exit 1

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmarks/current.txt
            comparison.txt
          retention-days: 30

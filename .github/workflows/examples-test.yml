name: Test Example Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-examples-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change touches anything the jobs below test. The path
  # filter lives here rather than on the triggers so that the workflow always
  # starts: a workflow skipped by a trigger filter reports nothing, and a
  # required check that never reports blocks the pull request indefinitely.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # List the files a pull request changes
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Pull requests are compared through the API. Pushes are compared with git,
      # which needs the repository.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the true/false output below is used. The action's list of changed
      # file names is never read.
      - name: Match changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'examples/**'
              - 'internal/cst/**'
              - 'internal/plugins/**'
              - 'internal/engines/style/**'
              - '.github/workflows/examples-test.yml'

  test-example-rules:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build TerraTidy
        run: go build -o bin/terratidy ./cmd/terratidy

      - name: Build Go plugin
        run: |
          cd examples/go-rule
          go mod tidy
          go build -buildmode=plugin -o require-tags.so
          shasum -a 256 require-tags.so > .terratidy-plugins.sha256

      - name: Test YAML rules
        run: |
          ./bin/terratidy style --config examples/yaml-rule-test.yaml examples/rule-test-files/missing-description.tf 2>&1 | tee output.txt
          grep -q "require-description" output.txt

      - name: Test Bash rules
        run: |
          chmod +x examples/bash-rule/no-hardcoded-account-id.sh
          ./bin/terratidy style --config examples/bash-rule-test.yaml examples/rule-test-files/hardcoded-account.tf 2>&1 | tee output.txt
          grep -q "no-hardcoded-account-id" output.txt

      - name: Test Go plugin rules
        run: |
          ./bin/terratidy style --config examples/go-rule-test.yaml examples/rule-test-files/missing-tags.tf 2>&1 | tee output.txt
          grep -q "require-tags" output.txt

      - name: Test all rules together
        run: |
          ./bin/terratidy style --config examples/all-rules-test.yaml examples/rule-test-files/*.tf --format json 2>&1 | tee output.json
          grep -q '"rule": "require-tags"' output.json
          grep -q '"rule": "require-description"' output.json
          grep -q '"rule": "no-hardcoded-account-id"' output.json

      - name: Test valid file has no findings
        run: |
          ./bin/terratidy style --config examples/all-rules-test.yaml examples/rule-test-files/valid.tf 2>&1 | tee output.txt
          grep -q "No issues found" output.txt

      - name: Test Terragrunt include-first example
        run: |
          ./bin/terratidy style --config examples/terragrunt.yaml examples/rule-test-files/terragrunt-include-order.hcl 2>&1 | tee output.txt
          grep -q "terragrunt-include-first" output.txt

  # The one check to require for this workflow. It waits on every other job and
  # passes only if each one succeeded or was skipped because the change did not
  # touch what it tests. It uses always() rather than !cancelled() on purpose: a
  # cancelled run has to fail this check, whereas a skipped required check would
  # count as passing.
  result:
    name: Example rules result
    if: always()
    needs: [changes, test-example-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r 'to_entries[]
            | select((.key == "changes" and .value.result != "success")
                     or (.value.result != "success" and .value.result != "skipped"))
            | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi

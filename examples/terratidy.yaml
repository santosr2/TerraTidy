# TerraTidy Configuration Example
# This file shows all available configuration options

version: 1

# Import other config files (glob patterns supported)
imports:
  - .terratidy/*.yaml
  # - ./config/base.yaml

# Exclude patterns - glob patterns for files/directories to skip
# These are combined with CLI --exclude patterns
exclude:
  - "**/*.generated.tf"     # Exclude generated files
  - "vendor/**"             # Exclude vendor directory
  - ".terraform/**"         # Exclude Terraform cache (also auto-skipped)
  - "test/fixtures/**"      # Exclude test fixtures
  # - "modules/legacy/**"   # Exclude legacy modules during migration

# Global settings
severity_threshold: warning  # Filter diagnostics (info|warning|error)
fail_fast: false             # Stop on first error
parallel: true               # Run engines in parallel
recursive: true              # Scan subdirectories (false = only specified dirs)

# Cache configuration (optional, defaults shown)
# cache:
#   max_age: 5m      # Maximum age of cache entries
#   max_size: 1000   # Maximum number of entries (LRU eviction)
#   disabled: false  # Disable caching entirely

# Output configuration
output:
  absolute_paths: false  # Use absolute file paths instead of relative
                         # Set true for tooling that needs full paths

# Engine configuration
engines:
  # Format engine - uses hclwrite.Format()
  fmt:
    enabled: true
    # check: false   # Check mode - report but don't modify files
    # diff: false    # Show diff of changes

  # Style engine - custom layout and spacing rules
  style:
    enabled: true
    # fix: false     # Auto-fix mode - apply fixes automatically
    # diff: false    # Show diff when fixing
    # Rule-specific configuration
    rules:
      # Enable a rule that's disabled by default
      style.resource-name-matches-type:
        enabled: true
        severity: warning
      # Change severity of a rule
      style.blank-line-between-blocks:
        enabled: true
        severity: error
      # Disable a rule
      style.no-empty-blocks:
        enabled: false
      # Rule with custom config options
      style.variable-naming:
        enabled: true
        severity: warning
        config:
          options:
            case: snake_case  # Options: snake_case, camelCase, kebab-case, PascalCase

  # Lint engine - 11 built-in AST rules, optional TFLint integration (subprocess)
  lint:
    enabled: true
    config_file: .tflint.hcl   # Path to TFLint config file (only used when use_tflint: true)
    # plugins:                  # TFLint plugins to enable
    #   - aws
    #   - google
    # args:                     # Extra arguments for TFLint
    #   - --force
    # use_tflint: false         # Enable TFLint subprocess integration
    # tflint_path: tflint       # Custom TFLint binary path
    # fallback_builtin: false   # Use built-in rules if TFLint unavailable
    # rules:                    # Rule-specific configuration
    #   lint.terraform-deprecated-syntax:
    #     enabled: true
    #     severity: error

  # Policy engine - OPA/Rego
  policy:
    enabled: false
    policy_dirs:
      - ./policies
    # policy_files:             # Individual policy files
    #   - ./custom-policy.rego
    # data_files:               # Additional data files for policies
    #   - ./policy-data.json
    # rules:                    # Rule-specific configuration
    #   required-tags:
    #     enabled: true
    #     severity: error

# Profiles - different configurations for different contexts
profiles:
  ci:
    description: "Strict CI/CD checks"
    engines:
      fmt: { enabled: true }
      style: { enabled: true }
      lint: { enabled: true }
      policy: { enabled: true }

  development:
    description: "Fast development checks"
    engines:
      fmt: { enabled: true }
      style: { enabled: true }
      lint: { enabled: false }
      policy: { enabled: false }

  strict:
    description: "Strict mode inheriting from ci"
    inherits: ci
    engines:
      style:
        rules:
          style.resource-name-matches-type:
            enabled: true
            severity: error

  minimal:
    description: "Minimal checks"
    inherits: ci
    engines:
      lint: { enabled: false }
      policy: { enabled: false }

# Plugin configuration
plugins:
  enabled: false
  directories:
    - .terratidy/plugins
    - ~/.terratidy/plugins
  # Per-plugin rule configuration (enable/disable, severity override)
  rules:
    require-description:
      enabled: true
      severity: warning
    # deprecated-resource:
    #   enabled: false  # Disable a plugin rule

name: Fix Docker Tags (One-time)

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  fix-docker-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Docker alias tags
        run: |
          IMAGE="ghcr.io/santosr2/terratidy"

          # Pull the images we need
          docker pull "${IMAGE}:v0.1.0"
          docker pull "${IMAGE}:v0.2.0-alpha.2"

          # Update v0 to point to v0.1.0 (latest stable in 0.x series)
          docker tag "${IMAGE}:v0.1.0" "${IMAGE}:v0"
          docker push "${IMAGE}:v0"
          echo "Updated v0 -> v0.1.0"

          # Update v0.1 to point to v0.1.0
          docker tag "${IMAGE}:v0.1.0" "${IMAGE}:v0.1"
          docker push "${IMAGE}:v0.1"
          echo "Updated v0.1 -> v0.1.0"

          # Update latest to point to v0.2.0-alpha.2 (latest version overall)
          docker tag "${IMAGE}:v0.2.0-alpha.2" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
          echo "Updated latest -> v0.2.0-alpha.2"

      - name: Delete incorrect v0.2 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get package version ID for v0.2 tag
          # Note: We can't easily delete individual tags, but we can overwrite them
          # or leave them as-is since they'll be corrected when 0.2.0 stable is released

          echo "Note: v0.2 tag cannot be easily deleted via API."
          echo "It will be overwritten when v0.2.0 stable is released."
          echo "For now, users should use v0.2-alpha for pre-release versions."

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change touches anything the jobs below test. The path
  # filter lives here rather than on the triggers so that the workflow always
  # starts: a workflow skipped by a trigger filter reports nothing, and a
  # required check that never reports blocks the pull request indefinitely.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # List the files a pull request changes
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Pull requests are compared through the API. Pushes are compared with git,
      # which needs the repository.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the true/false output below is used. The action's list of changed
      # file names is never read.
      - name: Match changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'revive.toml'
              - '.goreleaser.yml'
              - '.go-version'
              - '.github/workflows/test.yml'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        go-version: ['1.26.x', '1.27.x']

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          # cache: true (default) is intentional here; the test job's matrix
          # (3 OSes x 2 Go versions) is the hottest in CI and cache keys are
          # isolated per Go version, bounding poisoning risk. Other workflows
          # disable cache to avoid poisoning: vscode.yml and security.yml on
          # every push/PR, release.yml on tag-triggered release builds.

      - name: Download dependencies
        run: go mod download

      - name: Run tests (with coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Run tests (without coverage)
        if: matrix.os != 'ubuntu-latest'
        run: go test -v -race ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./coverage.out

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Build
        run: go build -v ./...

      - name: Verify binary
        run: go run ./cmd/terratidy version

  reproducible-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Reproducible Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # goreleaser derives the snapshot version from git describe
          persist-credentials: false

      # .go-version, not the floating 1.27.x the other jobs use: this job exists
      # to check the binary release.yml would publish, and a different Go patch
      # produces a different binary.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # Disable cache: this job builds through goreleaser, same reasoning as release.yml

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.16.0  # keep in step with release.yml
          install-only: true

      # Builds through goreleaser, twice, from two paths of different lengths and
      # a few seconds apart. Both variations earn their place: a build path that
      # survives into the binary fails the first, and a wall-clock timestamp fails
      # the second. Running `go build` twice in one directory catches neither,
      # which is how a {{ .Date }} stamp reached the go:embed-ed version.json and
      # made every release unreproducible without CI noticing.
      - name: Build twice and compare
        run: |
          set -euo pipefail
          build() {
            cp -a "$GITHUB_WORKSPACE" "$1"
            (cd "$1" && goreleaser build --clean --single-target --snapshot >/dev/null)
            sha256sum "$1"/dist/*/terratidy | cut -d' ' -f1
          }
          first=$(build /tmp/repro-a)
          sleep 3
          second=$(build /tmp/repro-b-from-a-longer-path)
          echo "first:  $first"
          echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::Release build is not reproducible: the same source produced two different binaries." >&2
            exit 1
          fi
          echo "Release build is reproducible."

  # The one check to require for this workflow. It waits on every other job and
  # passes only if each one succeeded or was skipped because the change did not
  # touch what it tests. It uses always() rather than !cancelled() on purpose: a
  # cancelled run has to fail this check, whereas a skipped required check would
  # count as passing.
  result:
    name: Test result
    if: always()
    needs: [changes, test, lint, build, reproducible-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r 'to_entries[]
            | select((.key == "changes" and .value.result != "success")
                     or (.value.result != "success" and .value.result != "skipped"))
            | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi

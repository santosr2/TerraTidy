# Example GitHub Actions workflow for TerraTidy
#
# Installation:
#   1. Copy this file to .github/workflows/terratidy.yml
#   2. Commit and push
#
# Features:
#   - Runs on pull requests and pushes to main
#   - Uploads SARIF results to GitHub Code Scanning
#   - Adds annotations to PR diffs

name: Terraform Quality

on:
  push:
    branches: [main, develop]
    paths:
      - "**.tf"
      - "**.hcl"
      - ".github/workflows/terratidy.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "**.tf"
      - "**.hcl"

permissions:
  contents: read
  security-events: write # For SARIF upload
  pull-requests: write # For PR comments

concurrency:
  group: terratidy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  terratidy:
    name: TerraTidy Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run TerraTidy
        uses: santosr2/terratidy@v0
        with:
          format: github
          # Exclude generated files and test fixtures
          exclude: "**/*.generated.tf,test/**"
          # Run engines in parallel for speed
          parallel: "true"

      - name: Run TerraTidy with SARIF output
        if: always()
        uses: santosr2/terratidy@v0
        with:
          format: sarif
          fail-on-error: "false"
          # Pass github-token to enable automatic SARIF upload
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Auto-fix on push
  terratidy-fix:
    name: Auto-fix Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"

      - name: Install TerraTidy
        run: go install github.com/santosr2/TerraTidy/cmd/terratidy@latest

      - name: Run TerraTidy Fix
        run: terratidy fix

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "style: auto-fix TerraTidy formatting and style"
          git push

  # Optional: Check specific modules (non-recursive)
  terratidy-modules:
    name: Check Individual Modules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        module: [networking, compute, database]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Module
        uses: santosr2/terratidy@v0
        with:
          working-directory: modules/${{ matrix.module }}
          # Check only this module, not submodules
          no-recurse: "true"
          # Use absolute paths for clearer error messages
          absolute-paths: "true"
          format: text
          fail-on-error: "true"
